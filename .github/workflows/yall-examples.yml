name: Yall examples

on:
  pull_request:
    paths:
      - 'examples/yall/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/yall-examples.yml'
  push:
    branches: [main, yall-integration-upstream]
    paths:
      - 'examples/yall/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/yall-examples.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline checks (${{ matrix.runner }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: minimum-account-policy
            revision: c2486d4ba756d2db79966c41f998d4d00366e787
          - runner: main-2026-09-29
            revision: 5a39498d023b1c9edcaa08926c80f2bb848efda9
    steps:
      - name: Check out LFHCal (no decoder needed for offline tests)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out pinned optional runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: paulnord/yall-run
          ref: ${{ matrix.revision }}
          path: .ci/yall-run
          persist-credentials: false
      - name: Install tcsh for real activation-script checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tcsh
      - name: Shell syntax and offline environment tests
        run: |
          bash -n tools/bootstrap-yall-integration.sh
          bash -n tools/run-in-eic-shell.sh
          python3 -m unittest discover -s tools/tests -v
      - name: Expand and check all workflow graphs (no ROOT, data or submission)
        env:
          PYTHONPATH: ${{ github.workspace }}/.ci/yall-run/src
        run: python3 examples/yall/check_shared_conversions.py -v
