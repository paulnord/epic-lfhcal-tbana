name: Validate shared conversions
on:
  push:
    branches: [feat/shared-conversions]
    paths: [.github/workflows/shared-conversions-implementation.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lfhcal
    env:
      PYTHONPATH: ../yall/src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/shared-conversions
          path: lfhcal
      - uses: actions/checkout@v4
        with:
          repository: paulnord/yall-run
          ref: 236163a5ba668da64f1ec521ac558d582bcb4832
          path: yall
      - name: Apply and verify reviewed example files
        run: |
          python3 .shared-conversions-apply.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              'examples/yall/README.md': '8ad95cb7dad1ffd3c1250464463a928e15a0fc93c5a4b6929e0f3731eded79ec',
              'examples/yall/check_shared_conversions.py': 'e91b3755094a7df0b19fac73fba031b222d437769a81ac31edd8d1bf17c1a7a4',
              'examples/yall/lfhcal-simple/README.md': 'bdfca8f24fff63cd6fd1713d9375833ecb7e1ec4e453dc7cd8f6ac45efb0419b',
              'examples/yall/lfhcal-simple/Yallfile': '704c9c26ae433b835add66b727fbfecae7b1fa928c9a411ea6e14dc3a58bfea7',
              'examples/yall/scan-set-1/Yallfile': '75de7ed1fb408a84f53a25d20df756dc5db892ccf85e24682ae378fca49485e5',
              'examples/yall/scan-set-2/Yallfile': '3fe532cdfad1daaeae4584e0ba7b125c85bb9a2c04eccfd7d0edb6b5e028c94e',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check default and shared-run graphs on Python 3.9
        run: python examples/yall/check_shared_conversions.py -v
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check default and shared-run graphs on Python 3.12
        run: python examples/yall/check_shared_conversions.py -v
      - name: Compare every retained scientific payload with integration baseline
        run: |
          git fetch origin e163afb36339cb121070066bcfd617cbbeef0eba
          python - <<'PY'
          from pathlib import Path
          from dataclasses import asdict
          import os, re, subprocess
          from yall_run.model import load_spec
          os.environ.update(LFHCAL_DATA='/data', LFHCAL_WORK='/work', EIC_SHELL='/eic-shell')
          for which in ('scan-set-1','scan-set-2','lfhcal-simple'):
              rel = f'examples/yall/{which}/Yallfile'
              p = Path(rel).absolute()
              new = p.read_bytes()
              original = subprocess.check_output(['git','show',f'e163afb36339cb121070066bcfd617cbbeef0eba:{rel}'])
              try:
                  p.write_bytes(original)
                  old = load_spec(p)
              finally:
                  p.write_bytes(new)
              updated = load_spec(p)
              tasks = {t.name:t for t in updated.tasks}
              def renamed(name):
                  return re.sub(r'^(pedestal-\d+)-\d+$',r'\1',re.sub(r'^convert-(?:ped|muon)-','convert-',name))
              for task in old.tasks:
                  if task.name == 'converted':
                      continue
                  name = renamed(task.name)
                  lhs, rhs = asdict(task), asdict(tasks[name])
                  for key in ('name','parents'):
                      lhs.pop(key)
                      rhs.pop(key)
                  assert lhs == rhs, (which,task.name,name)
                  if which != 'lfhcal-simple':
                      assert tuple(renamed(x) for x in task.parents) == tasks[name].parents
              for key in ('backend','name','condor','execution','set_values'):
                  assert getattr(old,key) == getattr(updated,key), key
              print(which, len(old.tasks), '->', len(updated.tasks), 'retained scientific payloads unchanged')
          PY
      - name: Commit tested refactor
        run: |
          rm .shared-conversions-apply.py .github/workflows/shared-conversions-implementation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Use one conversion family and fit shared pedestals once'
          git push origin HEAD:feat/shared-conversions
